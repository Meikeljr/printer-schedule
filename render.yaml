services:
  - type: web
    name: printer-tracker-backend
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: printer_refill_db
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
